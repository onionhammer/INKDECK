; Waveshare ESP32-S3-ePaper-3.97 firmware.
; Board memory/USB settings (16 MB QIO flash, octal PSRAM, native USB CDC) live in
; boards/waveshare_esp32_s3_epaper_397.json. See AGENTS.md for hardware context.

[platformio]
default_envs = epaper397

[env:epaper397]
platform = espressif32 @ ~8.0.0          ; Arduino core 3.3.x (IDF 5.5)
board = waveshare_esp32_s3_epaper_397
framework = arduino
board_build.partitions = app3M_fat9M_16MB.csv   ; 2x3 MB OTA app slots + 9.9 MB FAT
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts =
    pre:scripts/gen_secrets.py           ; Wi-Fi credentials etc. from .env -> inkdeck_secrets.h
    pre:scripts/gen_build_info.py        ; git commit -> inkdeck_build.h (System shows it)
build_unflags =
    -DCORE_DEBUG_LEVEL=0                 ; framework hard-codes 0; replaced below
build_flags =
    -Os                                  ; optimize for size. The framework's build script adds no -O, so
                                         ; GCC would default to -O0 for us, the Arduino core and the libraries
                                         ; (the Arduino IDE adds -Os itself). -Os: image 2.81 -> 2.08 MB
    -fno-exceptions                      ; nothing catches; saves ~110 KB of unwind tables (src/psram_new.cpp)
    -DESP32_ARDUINO_NO_RGB_BUILTIN       ; the generic S3 variant claims an RGB LED this board lacks, so
                                         ; digitalWrite() linked an RMT LED driver (~22 KB)
    -DNO_GZIP -DNOBYFOUR                 ; PNGdec's zlib: no gzip wrapper, byte-wise CRC (~9 KB)
    -DCORE_DEBUG_LEVEL=3                 ; 0=none … 5=verbose
    -DINKDECK_FAHRENHEIT=1               ; US units: °F, mph, inches (0 or unset: °C, km/h, mm); src/units.h
    -DINKDECK_STANDBY_WEATHER_HOURS=3    ; standby fetches the forecast every N hours (0 or unset: never); src/forecast.h
    -DINKDECK_PIN_ON=files                ; where a set PIN is asked: any of these, comma-separated; src/pin_places.h
    -DPNG_MAX_BUFFERED_PIXELS=19232      ; PNGdec line buffer: 2 aligned lines of 2400 px RGBA (default fits 320)
    -I$PROJECT_DIR/compat                ; esp-dsp stand-in for PNGdec's S3 SIMD file (compat/)
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.11   ; drawing + FreeFonts (ASCII only)
    bitbank2/JPEGDEC @ ^1.6.1                 ; book pictures (src/picture.h)
    bitbank2/PNGdec @ ^1.1.6
lib_ignore =
    bb_spi_lcd                           ; JPEGDEC lists it for a display helper we don't use
