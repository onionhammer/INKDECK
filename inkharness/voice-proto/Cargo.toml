[package]
name = "voice-proto"
version = "0.1.0"
edition = "2024"

[dependencies]
hkdf = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# use-chacha20poly1305 only because snow 0.10.0's AES-GCM code needs the KeyInit import that
# feature brings in; the protocol uses AES-GCM.
snow = { version = "0.10.0", default-features = false, features = ["std", "use-aes-gcm", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util"], optional = true }

[features]
tokio = ["dep:tokio"]

[dev-dependencies]
# The handshake written out by hand (crypto.rs's reference test), as the board does it.
aes-gcm = "0.10.3"
hmac = "0.13.0"
x25519-dalek = "2.0.1"
