[package]
name = "inkharness"
version = "0.1.0"
edition = "2024"
description = "An assistant with tools, skills and MCP servers: a terminal chat, or the daemon INKDECK boards talk to"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.23.1"
bytes = "1.12.1"
# Schedules in local time (already in the tree through rmcp and schemars).
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
# Reader view for a board's News (reader.rs): Mozilla's Readability ported, and the Markdown.
dom_query = "0.30.0"
dom_smoothie = "0.20.0"
eventsource-stream = "0.2.3"
# The pictures in a page a board reads (reader.rs), dithered for e-paper.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
futures-util = "0.3.34"
# Unlock tickets and session ids (already in the tree through snow and reqwest).
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "multipart"] }
rquickjs = "0.14.0"
rmcp = { version = "3.10.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The agent PIN's hash (already in the tree through voice-proto).
sha2 = "0.11.1"
sherpa-onnx = { version = "2.0.1", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "process"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
voice-proto = { version = "0.1.0", path = "../voice-proto", features = ["tokio"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

[dev-dependencies]
# The test server and the mcp_demo example.
rmcp = { version = "3.10.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }

[features]
local = ["dep:sherpa-onnx"]
